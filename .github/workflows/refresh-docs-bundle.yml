name: Refresh docs bundle

# Level 2: Actions → Refresh docs bundle → Run workflow
# Level 3: dero-docs push to main → repository_dispatch → this workflow

on:
  workflow_dispatch:
    inputs:
      dero_docs_ref:
        description: 'dero-docs git ref to index (branch, tag, or SHA)'
        required: false
        default: main
  repository_dispatch:
    types: [dero-docs-updated]

permissions:
  contents: write

concurrency:
  group: refresh-docs-bundle
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve dero-docs ref
        id: meta
        # The dispatch payload is attacker-influenceable, so it reaches the shell
        # as an env var, never interpolated by ${{ }} into the script body, and
        # check-ref-format rejects shell metacharacters like backticks/$()/quotes
        # before REF is used anywhere. This closes injection, not choice.
        #
        # On the repository_dispatch path we go further: the only legitimate
        # sender (dero-docs' sync-mcp-docs-bundle.yml) always sets ref to its
        # own ${{ github.sha }}, a 40-hex commit SHA — never a branch or tag —
        # so we require that exact shape here. Anyone else who can fire this
        # event (holds MCP_DOCS_SYNC_TOKEN or repo write) can therefore only
        # point us at a commit that already exists in DHEBP/dero-docs, not pick
        # an arbitrary branch/tag whose content could differ from what was
        # actually pushed to main. workflow_dispatch stays branch/tag-capable
        # since that path is a human with write access to this repo already.
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          MANUAL_REF: ${{ inputs.dero_docs_ref }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            REF="$DISPATCH_REF"
            if [ -z "$REF" ]; then REF="main"; fi
            SOURCE="dero-docs push (${REF})"
            if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::repository_dispatch ref must be a full commit SHA, got: $REF"
              exit 1
            fi
          else
            REF="$MANUAL_REF"
            if [ -z "$REF" ]; then REF="main"; fi
            SOURCE="manual workflow_dispatch (${REF})"
            git check-ref-format --allow-onelevel "$REF" >/dev/null || { echo "::error::Invalid dero-docs ref"; exit 1; }
          fi
          printf 'ref=%s\n' "$REF" >> "$GITHUB_OUTPUT"
          printf 'source=%s\n' "$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Checkout dero-mcp-server
        uses: actions/checkout@v4
        with:
          path: dero-mcp-server

      - name: Checkout dero-docs
        uses: actions/checkout@v4
        with:
          repository: DHEBP/dero-docs
          ref: ${{ steps.meta.outputs.ref }}
          path: dero-docs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dero-mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: dero-mcp-server
        run: npm ci

      - name: Build bundled docs index
        working-directory: dero-mcp-server
        env:
          DERO_DOCS_ROOT: ${{ github.workspace }}/dero-docs
        run: npm run build:docs

      - name: Smoke test bundled docs
        working-directory: dero-mcp-server
        run: npm run build && npm run smoke:docs

      - name: Commit refreshed index to main
        working-directory: dero-mcp-server
        env:
          DOCS_REF: ${{ steps.meta.outputs.ref }}
          DOCS_SOURCE: ${{ steps.meta.outputs.source }}
        run: |
          if git diff --quiet -- data/docs-index.json; then
            echo "Docs index unchanged — nothing to commit."
            exit 0
          fi
          # Ignore timestamp-only churn: skip when the ONLY change is generated_at.
          SUBSTANTIVE=$(git diff -U0 -- data/docs-index.json \
            | grep -E '^[+-]' | grep -vE '^[+-]{3} ' | grep -vE '"generated_at"' || true)
          if [ -z "$SUBSTANTIVE" ]; then
            echo "Only the generated_at timestamp changed — skipping commit."
            git checkout -- data/docs-index.json
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/docs-index.json
          git commit -m "chore(docs): refresh bundled docs index from dero-docs (${DOCS_REF})"
          git push origin HEAD:main
          {
            echo "## ✅ Docs bundle refreshed on main"
            echo ""
            echo "**Source:** ${DOCS_SOURCE}"
            echo ""
            echo "The index reaches npm + mcp.derod.org only after a release:"
            echo "bump the version, add a CHANGELOG line, then \`git tag vX.Y.Z && git push --tags\`."
            echo "See \`docs/DOCS-BUNDLE-SYNC.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Make a failed refresh loud: GitHub emails on a failed run; this summary
      # tells you WHAT broke + links the run so the email is actionable.
      - name: Report failure
        if: failure()
        env:
          DOCS_REF: ${{ steps.meta.outputs.ref }}
          DOCS_SOURCE: ${{ steps.meta.outputs.source }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## ❌ Docs bundle refresh failed"
            echo ""
            echo "**Source:** ${DOCS_SOURCE:-unresolved}"
            echo "**dero-docs ref:** \`${DOCS_REF:-unresolved}\`"
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "The bundled docs index was NOT updated. Likely causes:"
            echo "- \`build:docs\` failed (dero-docs structure changed, or a parser error)"
            echo "- \`smoke:docs\` failed (e.g. the code-fidelity probe — index lost code examples)"
            echo ""
            echo "Recover: see \`docs/DOCS-BUNDLE-SYNC.md\` → Manual recovery."
          } >> "$GITHUB_STEP_SUMMARY"
