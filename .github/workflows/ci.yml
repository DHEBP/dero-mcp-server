name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check MCP tool descriptions
        run: npm run check:mcp-descriptions

      - name: Check tool docs citations
        run: npm run check:citations

      - name: MCP smoke probes
        run: npm run smoke:mcp
        env:
          DERO_DAEMON_URL: ${{ secrets.DERO_DAEMON_URL || '' }}

      - name: Docs smoke probes
        run: npm run smoke:docs

      - name: Docs ranking guard (offline)
        run: npm run check:docs-ranking

      - name: TELA parser guard (offline)
        run: npm run check:tela-parse

      - name: Run flow tests
        run: npm run test:flows
        env:
          # Uses default public RPC (82.65.143.182:10102)
          # Override with repository secret if you have a dedicated test daemon
          DERO_DAEMON_URL: ${{ secrets.DERO_DAEMON_URL || '' }}

      - name: Run composite flow tests
        run: npm run test:composites
        env:
          DERO_DAEMON_URL: ${{ secrets.DERO_DAEMON_URL || '' }}

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
